[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-manifest-guardrail"
version = "0.1.0"
description = "Static verification gate for LLM-generated Kubernetes manifests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
web = ["starlette>=0.37", "uvicorn>=0.30"]
agent = ["mcp>=1.2,<2", "anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "starlette>=0.37", "uvicorn>=0.30",
       "mcp>=1.2,<2", "anthropic>=0.40", "pytest-asyncio>=0.23"]

[project.scripts]
k8s-guardrail = "k8s_guardrail.cli:main"
k8s-guardrail-web = "k8s_guardrail.web:main"
k8s-guardrail-mcp = "k8s_guardrail.mcp_server:main"
k8s-guardrail-agent = "k8s_guardrail.agent_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
k8s_guardrail = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Starlette recommends httpx2, which needs Python 3.11+; this project supports 3.10.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
