[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-manifest-guardrail"
version = "0.1.0"
description = "Static verification gate for LLM-generated Kubernetes manifests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
web = ["starlette>=0.37", "uvicorn>=0.30"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
k8s-guardrail = "k8s_guardrail.cli:main"
k8s-guardrail-web = "k8s_guardrail.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
k8s_guardrail = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
